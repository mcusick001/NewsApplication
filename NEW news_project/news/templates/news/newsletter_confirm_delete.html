{% extends 'news/base.html' %}
{% block content %}
<h2>Delete Newsletter</h2>
<p>Are you sure you want to delete the newsletter <strong>"{{ newsletter.title }}"</strong>?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'dashboard_redirect' %}" class="btn">Cancel</a>
</form>
{% endblock %}
