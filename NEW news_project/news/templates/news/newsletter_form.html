{% extends 'news/base.html' %}
{% block content %}
<h2>{% if newsletter %}Edit Newsletter{% else %}Create Newsletter{% endif %}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{% if newsletter %}Update Newsletter{% else %}Publish Newsletter{% endif %}</button>
</form>
<br>
<a href="{% url 'dashboard_redirect' %}">Cancel</a>
{% endblock %}
