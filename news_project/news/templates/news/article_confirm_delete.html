{% extends 'news/base.html' %}
{% block content %}
<h2>Delete Article</h2>
<p>Are you sure you want to delete the article <strong>"{{ article.title }}"</strong>? This action cannot be undone.</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'dashboard_redirect' %}" class="btn">Cancel</a>
</form>
{% endblock %}
