{% extends 'news/base.html' %}
{% block content %}
<h2>Manage Your Subsciptions</h2>
<form method="POST">
    {% csrf_token %}
    <h3>Publishers</h3>
    {% for pub in publishers %}
        <div>
            <label>
                <input type="checkbox" name="publishers" value="{{ pub.id }}" {% if pub in user.subscriptions_publishers.all %}checked{% endif %}>
                {{ pub.name }}
            </label>
        </div>
    {% endfor %}

    <h3>Journalist</h3>
    {% for jour in journalists %}
        <div>
            <label>
                <input type="checkbox" name="journalists" value="{{ jour.id }}" {% if jour in user.subscriptions_journalists.all %}checked{% endif %}>
                {{ jour.username }}
            </label>
        </div>
    {% endfor %}
    <br>
    <button type="submit" class="btn">Save Subscriptions</button>
</form>
{% endblock %}
